# Môi trường dev: make dev  (docker compose up --build)
# Giá trị mặc định dưới đây chỉ dành cho máy dev; ghi đè bằng biến môi trường hoặc file .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worktrack}
      POSTGRES_DB: ${POSTGRES_DB:-worktrack}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      HTTP_ADDR: ':8080'
      DATABASE_URL: postgres://${POSTGRES_USER:-worktrack}:${POSTGRES_PASSWORD:-worktrack}@postgres:5432/${POSTGRES_DB:-worktrack}?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
